name: Daily dashboard
on:
  schedule:
    - cron: "0 0 * * *"   # 7:00 AM Pacific (PDT)
  workflow_dispatch:
  push:
    paths: [positions.csv, build.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python build.py
      - run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Daily update" && git push)
